<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050508">
<title>MONOMOD OS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace;color:#c8c8d4}

/* ═══ BOOT SCREEN ═══ */
#boot{position:fixed;inset:0;background:#050508;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10000;transition:opacity 1s}
#boot .logo{font-size:24px;letter-spacing:8px;color:#4dd0c7;margin-bottom:20px}
#boot .bar{width:200px;height:2px;background:#1c1c26;overflow:hidden}
#boot .bar-fill{height:100%;background:#4dd0c7;width:0%;transition:width 0.3s}
#boot .msg{margin-top:12px;font-size:10px;color:#555;letter-spacing:2px}

/* ═══ LOGIN ═══ */
#login{position:fixed;inset:0;background:#050508;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:9000}
#login h2{color:#4dd0c7;letter-spacing:4px;margin-bottom:20px;font-size:14px}
#login .obs-list{max-height:40vh;overflow-y:auto;width:80%;max-width:300px}
#login .obs-item{padding:10px;margin:4px 0;background:#0a0a12;border:1px solid #1c1c26;border-radius:4px;cursor:pointer;font-size:11px}
#login .obs-item:hover{border-color:#4dd0c7}
#login .obs-item.active{border-color:#ffd700;color:#ffd700}
#login input{margin-top:12px;padding:8px;background:#0a0a12;border:1px solid #1c1c26;color:#c8c8d4;font:inherit;width:80%;max-width:300px;font-size:11px}
#login button{margin-top:8px;padding:8px 20px;background:transparent;border:1px solid #4dd0c7;color:#4dd0c7;font:inherit;cursor:pointer;font-size:11px}

/* ═══ DESKTOP ═══ */
#desktop{position:fixed;inset:0;background:radial-gradient(ellipse at center,#0a0a14 0%,#050508 100%);display:none;overflow:hidden}
#desktop-icons{position:absolute;top:20px;left:20px;display:flex;flex-direction:column;gap:16px}
.desktop-icon{width:70px;text-align:center;cursor:pointer;padding:8px;border-radius:4px}
.desktop-icon:hover{background:rgba(77,208,199,0.1)}
.desktop-icon .ico{font-size:28px;margin-bottom:4px}
.desktop-icon .lbl{font-size:9px;color:#c8c8d4;word-break:break-word}

/* ═══ TASKBAR ═══ */
#taskbar{position:fixed;bottom:0;left:0;right:0;height:36px;background:#08080c;border-top:1px solid #1c1c26;display:flex;align-items:center;padding:0 8px;z-index:5000;gap:4px}
.tb-btn{padding:4px 10px;background:#0a0a12;border:1px solid #1c1c26;color:#c8c8d4;font:inherit;font-size:10px;cursor:pointer;border-radius:3px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-btn.active{border-color:#4dd0c7;color:#4dd0c7}
.tb-btn.start{background:#0a0a12;border-color:#4dd0c7;color:#4dd0c7}
.tb-clock{margin-left:auto;font-size:10px;color:#555}

/* ═══ START MENU ═══ */
#start-menu{position:fixed;bottom:40px;left:8px;width:220px;background:#0a0a12;border:1px solid #1c1c26;border-radius:4px;padding:8px;display:none;z-index:5001;max-height:60vh;overflow-y:auto}
#start-menu .sm-item{padding:8px;font-size:11px;cursor:pointer;border-radius:3px}
#start-menu .sm-item:hover{background:#14141c}
#start-menu .sm-sep{height:1px;background:#1c1c26;margin:4px 0}

/* ═══ WINDOWS ═══ */
.window{position:absolute;background:#0a0a12;border:1px solid #1c1c26;border-radius:4px;min-width:200px;min-height:120px;display:flex;flex-direction:column;box-shadow:0 4px 20px rgba(0,0,0,0.5);overflow:hidden}
.window.active{border-color:#4dd0c7;box-shadow:0 4px 30px rgba(77,208,199,0.2)}
.window.minimized{display:none}
.win-title{height:28px;background:#08080c;display:flex;align-items:center;padding:0 8px;cursor:move;border-bottom:1px solid #1c1c26;font-size:10px;letter-spacing:1px}
.win-title .t{flex:1;color:#4dd0c7}
.win-ctrl{display:flex;gap:4px}
.win-ctrl button{width:20px;height:20px;background:transparent;border:1px solid #1c1c26;color:#555;cursor:pointer;font-size:10px;border-radius:2px}
.win-ctrl button:hover{color:#c8c8d4;border-color:#555}
.win-body{flex:1;overflow:auto;padding:8px;font-size:11px;line-height:1.5}
.win-resize{position:absolute;right:0;bottom:0;width:12px;height:12px;cursor:nwse-resize}

/* ═══ TERMINAL APP ═══ */
.term{background:#050508;color:#c8c8d4;font-family:'Courier New',monospace;font-size:12px;padding:8px;height:100%;overflow-y:auto}
.term .line{margin-bottom:2px;white-space:pre-wrap;word-break:break-word}
.term .prompt{color:#4dd0c7}
.term .err{color:#ff4757}
.term .ok{color:#2ed573}
.term .gold{color:#ffd700}
.term input{background:transparent;border:none;color:#c8c8d4;font:inherit;font-size:12px;outline:none;width:80%}

/* ═══ FILE MANAGER ═══ */
.fm-path{padding:6px;background:#08080c;border-bottom:1px solid #1c1c26;font-size:10px;color:#555}
.fm-list{padding:8px}
.fm-item{padding:6px;cursor:pointer;border-radius:3px;font-size:11px}
.fm-item:hover{background:#14141c}
.fm-item.dir{color:#4dd0c7}
.fm-item.file{color:#c8c8d4}

/* ═══ GRAPH VIEWER ═══ */
#graph-canvas{width:100%;height:100%;background:#050508}

/* ═══ SETTINGS ═══ */
.settings-row{padding:8px;border-bottom:1px solid #14141c;font-size:11px}
.settings-row label{color:#555;display:block;margin-bottom:4px}
.settings-row input,.settings-row select{background:#050508;border:1px solid #1c1c26;color:#c8c8d4;padding:4px 8px;font:inherit;width:100%}

/* ═══ CONTEXT MENU ═══ */
#ctx-menu{position:fixed;background:#0a0a12;border:1px solid #1c1c26;border-radius:4px;padding:4px;display:none;z-index:9999;min-width:140px}
#ctx-menu .ctx-item{padding:6px 10px;font-size:11px;cursor:pointer}
#ctx-menu .ctx-item:hover{background:#14141c}

/* ═══ NOTIFICATION ═══ */
.notif{position:fixed;top:20px;right:20px;background:#0a0a12;border:1px solid #4dd0c7;border-radius:4px;padding:10px 16px;font-size:11px;z-index:9998;animation:slideIn 0.3s}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
</style>
</head>
<body>

<!-- BOOT -->
<div id="boot">
  <div class="logo">MONOMOD OS</div>
  <div class="bar"><div class="bar-fill" id="boot-bar"></div></div>
  <div class="msg" id="boot-msg">Инициализация ядра...</div>
</div>

<!-- LOGIN -->
<div id="login">
  <h2>ВЫБОР НАБЛЮДАТЕЛЯ</h2>
  <div class="obs-list" id="login-obs-list"></div>
  <input id="login-new" placeholder="Новый наблюдатель (имя или фраза-ключ)...">
  <button id="login-btn">ВОЙТИ</button>
</div>

<!-- DESKTOP -->
<div id="desktop">
  <div id="desktop-icons"></div>
  <div id="windows-container"></div>
</div>

<!-- TASKBAR -->
<div id="taskbar" style="display:none">
  <button class="tb-btn start" id="start-btn">☰ MONOMOD</button>
  <div id="taskbar-windows"></div>
  <div class="tb-clock" id="tb-clock">00:00</div>
</div>

<!-- START MENU -->
<div id="start-menu">
  <div class="sm-item" data-app="terminal"> Терминал</div>
  <div class="sm-item" data-app="files">📁 Файлы</div>
  <div class="sm-item" data-app="graph">◉ Граф 26D</div>
  <div class="sm-item" data-app="spiral">◎ Спираль</div>
  <div class="sm-item" data-app="observers">👁 Наблюдатели</div>
  <div class="sm-item" data-app="lineage"> Родословная</div>
  <div class="sm-item" data-app="settings"> Настройки</div>
  <div class="sm-item" data-app="about"> О системе</div>
  <div class="sm-sep"></div>
  <div class="sm-item" data-app="sleep"> Сон / Fold</div>
  <div class="sm-item" data-app="reboot">↻ Перезагрузка</div>
</div>

<!-- CONTEXT MENU -->
<div id="ctx-menu"></div>

<script>
"use strict";

// ═══════════════════════════════════════════════════════════════
// ЯДРО ОС · MONOMOD OS v15.0
// ═══════════════════════════════════════════════════════════════

const OS = {
  version: '15.0',
  bootTime: Date.now(),
  currentObserver: null,
  windows: new Map(),
  windowZ: 100,
  activeWindow: null,
  
  // ─── УТИЛИТЫ ──
  hash(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) {
      h = ((h << 5) - h) + s.charCodeAt(i);
      h |= 0;
    }
    return Math.abs(h).toString(16).toUpperCase().padStart(8, '0');
  },
  
  uid() {
    return Math.random().toString(36).substr(2, 8);
  },
  
  notify(text, type = 'ok') {
    const n = document.createElement('div');
    n.className = 'notif';
    n.style.borderColor = type === 'err' ? '#ff4757' : type === 'gold' ? '#ffd700' : '#4dd0c7';
    n.textContent = text;
    document.body.appendChild(n);
    setTimeout(() => n.remove(), 3000);
  },
  
  // ─── ФАЙЛОВАЯ СИСТЕМА (VFS) ───
  fs: {
    root: '/',
    storage: {},
    
    init() {
      const saved = localStorage.getItem('mm_os_fs');
      if (saved) {
        try { this.storage = JSON.parse(saved); } catch(e) { this.storage = {}; }
      }
      // Структура по умолчанию
      if (!this.storage['/']) this.storage['/'] = { type: 'dir', children: ['home', 'system', 'tmp'] };
      if (!this.storage['/home']) this.storage['/home'] = { type: 'dir', children: [] };
      if (!this.storage['/system']) this.storage['/system'] = { type: 'dir', children: ['config.sys', 'kernel.log'] };
      if (!this.storage['/tmp']) this.storage['/tmp'] = { type: 'dir', children: [] };
      if (!this.storage['/system/config.sys']) {
        this.storage['/system/config.sys'] = { type: 'file', content: 'MONOMOD OS v15.0\nObserver: ' + (OS.currentObserver || 'unknown') };
      }
      if (!this.storage['/system/kernel.log']) {
        this.storage['/system/kernel.log'] = { type: 'file', content: '[boot] OS initialized\n[boot] VFS mounted\n[boot] Ready' };
      }
    },
    
    save() {
      localStorage.setItem('mm_os_fs', JSON.stringify(this.storage));
    },
    
    resolve(path) {
      if (!path.startsWith('/')) path = '/' + path;
      const parts = path.split('/').filter(Boolean);
      let current = '/';
      for (const p of parts) {
        if (p === '..') {
          const pp = current.split('/').filter(Boolean);
          pp.pop();
          current = '/' + pp.join('/');
          if (!current) current = '/';
        } else if (p !== '.') {
          current = current === '/' ? '/' + p : current + '/' + p;
        }
      }
      return current;
    },
    
    ls(path) {
      const p = this.resolve(path);
      const node = this.storage[p];
      if (!node) return null;
      if (node.type === 'dir') return node.children.map(c => ({ name: c, type: this.storage[p + '/' + c]?.type || 'unknown' }));
      return null;
    },
    
    cat(path) {
      const p = this.resolve(path);
      const node = this.storage[p];
      if (!node || node.type !== 'file') return null;
      return node.content;
    },
    
    write(path, content) {
      const p = this.resolve(path);
      this.storage[p] = { type: 'file', content, modified: Date.now() };
      // Добавить в родительскую директорию
      const parent = p.substring(0, p.lastIndexOf('/')) || '/';
      const parentName = p.substring(p.lastIndexOf('/') + 1);
      if (this.storage[parent] && this.storage[parent].type === 'dir') {
        if (!this.storage[parent].children.includes(parentName)) {
          this.storage[parent].children.push(parentName);
        }
      }
      this.save();
    },
    
    mkdir(path) {
      const p = this.resolve(path);
      this.storage[p] = { type: 'dir', children: [], created: Date.now() };
      const parent = p.substring(0, p.lastIndexOf('/')) || '/';
      const parentName = p.substring(p.lastIndexOf('/') + 1);
      if (this.storage[parent] && this.storage[parent].type === 'dir') {
        if (!this.storage[parent].children.includes(parentName)) {
          this.storage[parent].children.push(parentName);
        }
      }
      this.save();
    },
    
    rm(path) {
      const p = this.resolve(path);
      if (p === '/') return false;
      delete this.storage[p];
      const parent = p.substring(0, p.lastIndexOf('/')) || '/';
      const parentName = p.substring(p.lastIndexOf('/') + 1);
      if (this.storage[parent]?.children) {
        this.storage[parent].children = this.storage[parent].children.filter(c => c !== parentName);
      }
      this.save();
      return true;
    }
  },
  
  // ─── МЕНЕДЖЕР ОКОН ───
  wm: {
    create(appId, title, content, opts = {}) {
      const id = 'win-' + OS.uid();
      const w = document.createElement('div');
      w.className = 'window';
      w.id = id;
      w.style.width = (opts.width || 400) + 'px';
      w.style.height = (opts.height || 300) + 'px';
      w.style.left = (50 + (OS.windows.size * 20)) + 'px';
      w.style.top = (50 + (OS.windows.size * 20)) + 'px';
      w.style.zIndex = ++OS.windowZ;
      
      w.innerHTML = `
        <div class="win-title">
          <span class="t">${title}</span>
          <div class="win-ctrl">
            <button data-act="min">_</button>
            <button data-act="max">□</button>
            <button data-act="close">×</button>
          </div>
        </div>
        <div class="win-body"></div>
        <div class="win-resize"></div>
      `;
      
      w.querySelector('.win-body').appendChild(content);
      document.getElementById('windows-container').appendChild(w);
      
      OS.windows.set(id, { id, appId, title, element: w, minimized: false, maximized: false });
      OS.wm.focus(id);
      OS.wm.setupDrag(w);
      OS.wm.setupResize(w);
      OS.wm.setupControls(w, id);
      OS.wm.updateTaskbar();
      
      return id;
    },
    
    focus(id) {
      const win = OS.windows.get(id);
      if (!win) return;
      OS.windows.forEach(w => w.element.classList.remove('active'));
      win.element.classList.add('active');
      win.element.style.zIndex = ++OS.windowZ;
      OS.activeWindow = id;
      OS.wm.updateTaskbar();
    },
    
    close(id) {
      const win = OS.windows.get(id);
      if (!win) return;
      win.element.remove();
      OS.windows.delete(id);
      OS.wm.updateTaskbar();
    },
    
    minimize(id) {
      const win = OS.windows.get(id);
      if (!win) return;
      win.minimized = !win.minimized;
      win.element.classList.toggle('minimized', win.minimized);
      OS.wm.updateTaskbar();
    },
    
    maximize(id) {
      const win = OS.windows.get(id);
      if (!win) return;
      win.maximized = !win.maximized;
      if (win.maximized) {
        win.element.style.left = '0';
        win.element.style.top = '0';
        win.element.style.width = '100%';
        win.element.style.height = 'calc(100% - 36px)';
      } else {
        win.element.style.width = '400px';
        win.element.style.height = '300px';
        win.element.style.left = '50px';
        win.element.style.top = '50px';
      }
    },
    
    setupDrag(w) {
      const title = w.querySelector('.win-title');
      let dragging = false, startX, startY, origX, origY;
      title.addEventListener('mousedown', e => {
        if (e.target.tagName === 'BUTTON') return;
        dragging = true;
        startX = e.clientX; startY = e.clientY;
        origX = w.offsetLeft; origY = w.offsetTop;
        OS.wm.focus(w.id);
        e.preventDefault();
      });
      document.addEventListener('mousemove', e => {
        if (!dragging) return;
        w.style.left = (origX + e.clientX - startX) + 'px';
        w.style.top = (origY + e.clientY - startY) + 'px';
      });
      document.addEventListener('mouseup', () => dragging = false);
      
      // Touch
      title.addEventListener('touchstart', e => {
        if (e.target.tagName === 'BUTTON') return;
        dragging = true;
        startX = e.touches[0].clientX; startY = e.touches[0].clientY;
        origX = w.offsetLeft; origY = w.offsetTop;
        OS.wm.focus(w.id);
      }, { passive: true });
      document.addEventListener('touchmove', e => {
        if (!dragging) return;
        w.style.left = (origX + e.touches[0].clientX - startX) + 'px';
        w.style.top = (origY + e.touches[0].clientY - startY) + 'px';
      }, { passive: true });
      document.addEventListener('touchend', () => dragging = false);
    },
    
    setupResize(w) {
      const handle = w.querySelector('.win-resize');
      let resizing = false, startX, startY, origW, origH;
      handle.addEventListener('mousedown', e => {
        resizing = true;
        startX = e.clientX; startY = e.clientY;
        origW = w.offsetWidth; origH = w.offsetHeight;
        e.preventDefault(); e.stopPropagation();
      });
      document.addEventListener('mousemove', e => {
        if (!resizing) return;
        w.style.width = Math.max(200, origW + e.clientX - startX) + 'px';
        w.style.height = Math.max(120, origH + e.clientY - startY) + 'px';
      });
      document.addEventListener('mouseup', () => resizing = false);
    },
    
    setupControls(w, id) {
      w.querySelectorAll('.win-ctrl button').forEach(btn => {
        btn.addEventListener('click', () => {
          const act = btn.dataset.act;
          if (act === 'close') OS.wm.close(id);
          else if (act === 'min') OS.wm.minimize(id);
          else if (act === 'max') OS.wm.maximize(id);
        });
      });
      w.addEventListener('mousedown', () => OS.wm.focus(id));
    },
    
    updateTaskbar() {
      const tb = document.getElementById('taskbar-windows');
      tb.innerHTML = '';
      OS.windows.forEach((win, id) => {
        const btn = document.createElement('button');
        btn.className = 'tb-btn' + (OS.activeWindow === id ? ' active' : '');
        btn.textContent = win.title;
        btn.onclick = () => {
          if (win.minimized) OS.wm.minimize(id);
          else if (OS.activeWindow === id) OS.wm.minimize(id);
          else OS.wm.focus(id);
        };
        tb.appendChild(btn);
      });
    }
  },
  
  // ─── МЕНЕДЖЕР ПРОЦЕССОВ (ПРИЛОЖЕНИЙ) ───
  apps: {
    registry: {},
    
    register(id, meta, factory) {
      this.registry[id] = { ...meta, factory };
    },
    
    launch(id) {
      const app = this.registry[id];
      if (!app) { OS.notify('Приложение не найдено: ' + id, 'err'); return; }
      const content = app.factory();
      OS.wm.create(id, app.title, content, app.opts || {});
    }
  },
  
  // ─── ЗАГРУЗКА ОС ───
  async boot() {
    const steps = [
      { msg: 'Инициализация ядра...', progress: 10 },
      { msg: 'Монтирование VFS...', progress: 30, action: () => OS.fs.init() },
      { msg: 'Загрузка наблюдателей...', progress: 50 },
      { msg: 'Регистрация приложений...', progress: 70, action: () => OS.registerApps() },
      { msg: 'Запуск рабочего стола...', progress: 90 },
      { msg: 'Готово', progress: 100 }
    ];
    
    for (const step of steps) {
      document.getElementById('boot-msg').textContent = step.msg;
      document.getElementById('boot-bar').style.width = step.progress + '%';
      if (step.action) step.action();
      await new Promise(r => setTimeout(r, 400));
    }
    
    await new Promise(r => setTimeout(r, 500));
    document.getElementById('boot').style.opacity = '0';
    setTimeout(() => {
      document.getElementById('boot').style.display = 'none';
      OS.showLogin();
    }, 1000);
  },
  
  showLogin() {
    const login = document.getElementById('login');
    const list = document.getElementById('login-obs-list');
    list.innerHTML = '';
    
    const observers = JSON.parse(localStorage.getItem('mm_observers_list') || '[]');
    if (observers.length === 0) {
      list.innerHTML = '<div style="color:#555;font-size:10px;text-align:center;padding:20px">Нет сохранённых наблюдателей.<br>Создайте нового ниже.</div>';
    } else {
      observers.forEach(obs => {
        const item = document.createElement('div');
        item.className = 'obs-item';
        item.textContent = obs.name + ' (' + obs.id.slice(-4) + ')';
        item.onclick = () => {
          document.querySelectorAll('.obs-item').forEach(i => i.classList.remove('active'));
          item.classList.add('active');
          document.getElementById('login-new').value = obs.name;
        };
        list.appendChild(item);
      });
    }
    
    login.style.display = 'flex';
  },
  
  login(name) {
    if (!name) return;
    const id = 'OBS-' + OS.hash(name);
    let observers = JSON.parse(localStorage.getItem('mm_observers_list') || '[]');
    let obs = observers.find(o => o.id === id);
    if (!obs) {
      obs = { id, name, created: Date.now() };
      observers.push(obs);
      localStorage.setItem('mm_observers_list', JSON.stringify(observers));
    }
    OS.currentObserver = obs;
    localStorage.setItem('mm_current_observer', id);
    
    document.getElementById('login').style.display = 'none';
    document.getElementById('desktop').style.display = 'block';
    document.getElementById('taskbar').style.display = 'flex';
    
    OS.setupDesktop();
    OS.startClock();
    OS.notify('Добро пожаловать, ' + name, 'gold');
  },
  
  setupDesktop() {
    const icons = document.getElementById('desktop-icons');
    icons.innerHTML = '';
    const desktopApps = [
      { id: 'terminal', ico: '', lbl: 'Терминал' },

  startClock() {

  registerApps() {
    // Терминал
    OS.apps.register('terminal', { title: 'Терминал', opts: { width: 500, height: 350 } }, () => {
      const term = document.createElement('div');
      term.className = 'term';
      let cwd = '/home';
      let history = [];
      let histIdx = -1;
      
      const print = (text, cls = '') => {
        const line = document.createElement('div');
        line.className = 'line ' + cls;
        line.textContent = text;
        term.appendChild(line);
        term.scrollTop = term.scrollHeight;
      };
      
      const prompt = () => {
        const line = document.createElement('div');
        line.className = 'line';
        line.innerHTML = `<span class="prompt">${OS.currentObserver?.name || 'user'}@monomod:${cwd}$ </span>`;
        const input = document.createElement('input');
        input.autocomplete = 'off';
        input.autocapitalize = 'off';
        line.appendChild(input);
        term.appendChild(line);
        input.focus();
        term.scrollTop = term.scrollHeight;
        
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter') {
            const cmd = input.value.trim();
            input.disabled = true;
            history.push(cmd);
            histIdx = history.length;
            execute(cmd);
            prompt();
          } else if (e.key === 'ArrowUp') {
            if (histIdx > 0) { histIdx--; input.value = history[histIdx]; }
            e.preventDefault();
          } else if (e.key === 'ArrowDown') {
            if (histIdx < history.length - 1) { histIdx++; input.value = history[histIdx]; }
            else { histIdx = history.length; input.value = ''; }
            e.preventDefault();
          }
        });
      };
      
      const execute = (cmdLine) => {
        if (!cmdLine) return;
        const parts = cmdLine.split(/\s+/);
        const cmd = parts[0].toLowerCase();
        const args = parts.slice(1);
        
        switch (cmd) {
          case 'help':
            print('Команды:', 'ok');
            print('  ls [path]       — список файлов');
            print('  cd <path>       — сменить директорию');
            print('  cat <file>      — показать файл');
            print('  echo <text>     — вывести текст');
            print('  write <f> <txt> — записать файл');
            print('  mkdir <name>    — создать папку');
            print('  rm <path>       — удалить');
            print('  ps              — процессы (окна)');
            print('  kill <id>       — закрыть окно');
            print('  run <app>       — запустить приложение');
            print('  apps            — список приложений');
            print('  obs             — текущий наблюдатель');
            print('  graph           — статистика графа');
            print('  spiral          — состояние спирали');
            print('  fold            — сон / свёртка');
            print('  clear           — очистить терминал');
            print('  date            — дата/время');
            print('  whoami          — текущий пользователь');
            print('  uname           — информация о системе');
            break;
          case 'ls':
            const path = args[0] || cwd;
            const items = OS.fs.ls(path);
            if (!items) print('Не найдено: ' + path, 'err');
            else items.forEach(i => print('  ' + (i.type === 'dir' ? '[D] ' : '[F] ') + i.name, i.type === 'dir' ? 'ok' : ''));
            break;
          case 'cd':
            if (!args[0]) { cwd = '/home'; break; }
            const np = OS.fs.resolve(cwd + '/' + args[0]);
            const nd = OS.fs.ls(np);
            if (nd) cwd = np;
            else print('Не найдено: ' + args[0], 'err');
            break;
          case 'cat':
            if (!args[0]) { print('Использование: cat <file>', 'err'); break; }
            const fp = OS.fs.resolve(cwd + '/' + args[0]);
            const content = OS.fs.cat(fp);
            if (content === null) print('Не найдено: ' + args[0], 'err');
            else print(content);
            break;
          case 'echo':
            print(args.join(' '));
            break;
          case 'write':
            if (args.length < 2) { print('Использование: write <file> <content>', 'err'); break; }
            const fn = args[0];
            const txt = args.slice(1).join(' ');
            OS.fs.write(OS.fs.resolve(cwd + '/' + fn), txt);
            print('Записано: ' + fn, 'ok');
            break;
          case 'mkdir':
            if (!args[0]) { print('Использование: mkdir <name>', 'err'); break; }
            OS.fs.mkdir(OS.fs.resolve(cwd + '/' + args[0]));
            print('Создано: ' + args[0], 'ok');
            break;
          case 'rm':
            if (!args[0]) { print('Использование: rm <path>', 'err'); break; }
            if (OS.fs.rm(OS.fs.resolve(cwd + '/' + args[0]))) print('Удалено: ' + args[0], 'ok');
            else print('Ошибка удаления', 'err');
            break;
          case 'ps':
            print('Активные окна:', 'ok');
            OS.windows.forEach((w, id) => print('  ' + id + ' — ' + w.title));
            break;
          case 'kill':
            if (args[0] && OS.windows.has(args[0])) { OS.wm.close(args[0]); print('Закрыто: ' + args[0], 'ok'); }
            else print('Окно не найдено', 'err');
            break;
          case 'run':
            if (args[0] && OS.apps.registry[args[0]]) { OS.apps.launch(args[0]); print('Запущено: ' + args[0], 'ok'); }
            else print('Приложение не найдено', 'err');
            break;
          case 'apps':
            print('Доступные приложения:', 'ok');
            Object.keys(OS.apps.registry).forEach(id => print('  ' + id + ' — ' + OS.apps.registry[id].title));
            break;
          case 'obs':
            print('Наблюдатель: ' + (OS.currentObserver?.name || 'none'), 'gold');
            print('ID: ' + (OS.currentObserver?.id || 'none'));
            break;
          case 'graph':
            const g = JSON.parse(localStorage.getItem('monomod_universal_graph_v1') || '[]');
            print('Связей в графе: ' + g.length, 'ok');
            break;
          case 'spiral':
            const sp = JSON.parse(localStorage.getItem('mm_spiral_' + (OS.currentObserver?.id || '')) || '{}');
            print('Уровень спирали: L' + (sp.level || 0), 'gold');
            break;
          case 'fold':
          case 'sleep':
            const seed = {
              y: 110.347,
              observer: OS.currentObserver?.id,
              timestamp: Date.now(),
              hash: OS.hash(JSON.stringify(OS.currentObserver))
            };
            localStorage.setItem('mm_sleep_seed', JSON.stringify(seed));
            print('Система свёрнута. Seed: ' + seed.hash, 'gold');
            print('Для пробуждения перезагрузите OS.', '');
            break;
          case 'clear':
            term.innerHTML = '';
            break;
          case 'date':
            print(new Date().toString());
            break;
          case 'whoami':
            print(OS.currentObserver?.name || 'unknown');
            break;
          case 'uname':
            print('MONOMOD OS v' + OS.version);
            print('Kernel: monomod-kernel-15.0');
            print('Observer: ' + (OS.currentObserver?.name || 'none'));
            break;
          case '':
            break;
          default:
            print('Неизвестная команда: ' + cmd + '. Введите help.', 'err');
        }
      };
      
      print('MONOMOD OS Terminal v' + OS.version, 'gold');
      print('Введите help для списка команд.', '');
      print('', '');
      prompt();
      
      return term;
    });
    
    // Файловый менеджер
    OS.apps.register('files', { title: 'Файловый менеджер', opts: { width: 450, height: 350 } }, () => {
      const fm = document.createElement('div');

          el.ondblclick = () => {

    // Граф 26D
    OS.apps.register('graph', { title: 'Граф 26D', opts: { width: 500, height: 400 } }, () => {
      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:relative;width:100%;height:100%';
      const canvas = document.createElement('canvas');
      canvas.id = 'graph-canvas';
      wrap.appendChild(canvas);
      
      const info = document.createElement('div');
      info.style.cssText = 'position:absolute;bottom:8px;left:8px;font-size:10px;color:#555;background:rgba(5,5,8,0.8);padding:4px 8px;border-radius:4px';
      wrap.appendChild(info);
      
      setTimeout(() => {
        const ctx = canvas.getContext('2d');
        canvas.width = wrap.clientWidth;
        canvas.height = wrap.clientHeight;
        const cx = canvas.width / 2, cy = canvas.height / 2;
        
        const g = JSON.parse(localStorage.getItem('monomod_universal_graph_v1') || '[]');
        info.textContent = 'Связей: ' + g.length;
        
        if (g.length === 0) {
          ctx.fillStyle = '#555';
          ctx.font = '12px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('Граф пуст. Введите данные в терминале.', cx, cy);
          return;
        }
        
        // Простая визуализация
        const nodes = new Set();
        g.forEach(([key]) => {
          const [a, b] = key.split('→');
          nodes.add(a); nodes.add(b);
        });
        
        const nodeArr = Array.from(nodes);
        const positions = {};
        nodeArr.forEach((n, i) => {
          const angle = (i / nodeArr.length) * Math.PI * 2;
          const r = Math.min(cx, cy) * 0.7;
          positions[n] = { x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r };
        });
        
        g.forEach(([key, link]) => {
          const [a, b] = key.split('→');
          if (positions[a] && positions[b]) {
            ctx.strokeStyle = 'rgba(77, 208, 199, ' + (link.w * 0.6) + ')';
            ctx.lineWidth = link.w * 2;
            ctx.beginPath();
            ctx.moveTo(positions[a].x, positions[a].y);
            ctx.lineTo(positions[b].x, positions[b].y);
            ctx.stroke();
          }
        });
        
        nodeArr.forEach(n => {
          const p = positions[n];
          ctx.fillStyle = '#4dd0c7';
          ctx.beginPath();
          ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#c8c8d4';
          ctx.font = '9px monospace';
          ctx.textAlign = 'center';
          ctx.fillText(n, p.x, p.y - 8);
        });
      }, 100);
      
      return wrap;
    });
    
    // Спираль
    OS.apps.register('spiral', { title: 'Спираль', opts: { width: 400, height: 300 } }, () => {

          <div style="color:${active ? '#ffd700' : '#c8c8d4'};font-size:11px">${obs.name}</div>

    OS.apps.register('lineage', { title: 'Родословная', opts: { width: 400, height: 300 } }, () => {

          <div style="color:#555;font-size:11px;line-height:1.6">
            Поколение: <span style="color:#ffd700">L0</span><br>
            Родители: <span style="color:#8b5cf6">—</span><br>

    // Настройки
    OS.apps.register('settings', { title: 'Настройки', opts: { width: 400, height: 300 } }, () => {
      const div = document.createElement('div');
      div.innerHTML = `
        <div class="settings-row">
          <label>Наблюдатель</label>

        </div>
        <div class="settings-row">

    // О системе
    OS.apps.register('about', { title: 'О системе', opts: { width: 400, height: 300 } }, () => {

      div.innerHTML = `

          <div style="color:#ffd700;font-size:14px;margin-bottom:16px">v${OS.version}</div>
          <div style="color:#555;font-size:11px;line-height:1.8;text-align:left">

          </div>

    // Сон / Fold
    OS.apps.register('sleep', { title: 'Сон', opts: { width: 300, height: 200 } }, () => {
      const div = document.createElement('div');
      div.innerHTML = `
        <div style="padding:20px;text-align:center">
          <div style="font-size:36px;margin-bottom:12px">☾</div>
          <div style="color:#4dd0c7;margin-bottom:12px">Свёртка системы</div>
          <div style="color:#555;font-size:11px;margin-bottom:16px">Сохранить состояние и перейти в сон?</div>
          <button onclick="const s={observer:OS.currentObserver?.id,timestamp:Date.now()};localStorage.setItem('mm_sleep_seed',JSON.stringify(s));OS.notify('Система свёрнута','gold');setTimeout(()=>location.reload(),1500)" style="padding:8px 20px;background:transparent;border:1px solid #4dd0c7;color:#4dd0c7;font:inherit;cursor:pointer">FOLD</button>
        </div>

    OS.apps.register('reboot', { title: 'Перезагрузка', opts: { width: 300, height: 200 } }, () => {

// ИНИЦИАЛИЗАЦИЯ UI

document.getElementById('login-btn').onclick = () => {
  const name = document.getElementById('login-new').value.trim();
  if (name) OS.login(name);
};

document.getElementById('login-new').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const name = e.target.value.trim();
    if (name) OS.login(name);
  }
});

document.getElementById('start-btn').onclick = () => {
  const menu = document.getElementById('start-menu');
  menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
};

document.querySelectorAll('#start-menu .sm-item').forEach(item => {
  item.onclick = () => {
    const app = item.dataset.app;
    if (app) OS.apps.launch(app);
    document.getElementById('start-menu').style.display = 'none';
  };
});

document.addEventListener('click', e => {
  if (!e.target.closest('#start-menu') && !e.target.closest('#start-btn')) {
    document.getElementById('start-menu').style.display = 'none';
  }
});

// Контекстное меню на рабочем столе
document.getElementById('desktop').addEventListener('contextmenu', e => {
  e.preventDefault();
  const menu = document.getElementById('ctx-menu');
  menu.innerHTML = `
    <div class="ctx-item" onclick="OS.apps.launch('terminal');document.getElementById('ctx-menu').style.display='none'">Открыть терминал</div>
    <div class="ctx-item" onclick="OS.apps.launch('files');document.getElementById('ctx-menu').style.display='none'">Открыть файлы</div>
    <div class="ctx-item" onclick="location.reload();document.getElementById('ctx-menu').style.display='none'">Перезагрузить</div>
  `;
  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';
  menu.style.display = 'block';
});

document.addEventListener('click', () => {
  document.getElementById('ctx-menu').style.display = 'none';
});

      observer: OS.currentObserver.id,
      timestamp: Date.now()
    };

});
