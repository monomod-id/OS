<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050508">
<title>MONOMOD</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#050508;color:#c8c8d4;font-family:'Courier New',monospace;overflow:hidden}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0}

/* ═══ ГОРИЗОНТАЛЬНЫЙ СЛАЙДЕР (вкладки) ═══ */
#h-slider{
  display:flex;height:100%;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
#h-slider::-webkit-scrollbar{display:none}

.tab{
  flex:0 0 100vw;height:100%;scroll-snap-align:start;
  display:flex;flex-direction:column;
  border-right:1px solid #14141c;
  position:relative;
}

/* ═══ ВКЛАДКА 1: СОСТОЯНИЕ (только горизонталь) ═══ */
#tab-state{align-items:center;justify-content:center}
.state-canvas{width:100%;height:100%;position:absolute;top:0;left:0}
.state-info{
  position:absolute;bottom:80px;left:0;right:0;
  text-align:center;font-size:10px;color:#555;z-index:2;
  pointer-events:none;
}
.state-info b{color:#ffd700}
.state-label{
  position:absolute;top:20px;left:0;right:0;
  text-align:center;font-size:11px;letter-spacing:3px;color:#4dd0c7;z-index:2;
}

/* ═══ ВЕРТИКАЛЬНЫЙ СЛАЙДЕР (ввод внутри вкладки) ═══ */
.v-slider{
  display:flex;flex-direction:column;height:100%;
  overflow-y:auto;scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;
}
.v-page{
  flex:0 0 100%;scroll-snap-align:start;
  display:flex;flex-direction:column;
  padding:16px;padding-top:calc(40px + env(safe-area-inset-top));
}

/* ═══ ВКЛАДКА 2: ОТВЕТ ═══ */
#tab-answer .v-top{flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px}
.answer-box{
  padding:20px;background:#0a0a12;border:1px solid #ffd700;
  color:#ffd700;font-size:16px;text-align:center;
  min-height:120px;display:flex;align-items:center;justify-content:center;
  line-height:1.6;word-break:break-word;border-radius:4px;
}
.answer-meta{font-size:10px;color:#555;margin-top:12px;text-align:center}
.answer-hint{font-size:9px;color:#333;text-align:center;margin-top:20px}

#tab-answer .v-input{
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom));
}
.input-label{font-size:10px;color:#555;letter-spacing:2px;margin-bottom:12px;text-align:center}
.input-field{
  width:100%;padding:14px;background:#0a0a12;border:1px solid #1c1c26;
  color:#c8c8d4;font:inherit;font-size:15px;outline:none;border-radius:4px;
}
.input-field:focus{border-color:#4dd0c7}

/* ═══ ВКЛАДКА 3: ЛОГ ═══ */
#tab-log .v-top{flex:1;overflow:hidden;display:flex;flex-direction:column;padding:16px}
.log-title{font-size:11px;letter-spacing:3px;color:#4dd0c7;margin-bottom:12px}
.log-metrics{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
  margin-bottom:12px;font-size:10px;
}
.log-metrics .m{padding:6px;background:#0a0a12;border:1px solid #14141c;border-radius:3px}
.log-metrics .k{color:#555;display:block;font-size:8px}
.log-metrics .v{color:#ffd700;font-size:12px}
.log-box{flex:1;overflow-y:auto;font-size:10px;line-height:1.5;color:#555}
.log-box div{padding:2px 0;border-bottom:1px dotted #14141c}
.log-box .gold{color:#ffd700}
.log-box .cmd{color:#4dd0c7}
.log-box .err{color:#ff4757}

#tab-log .v-input{
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom));
}

/* ═══ НАВИГАЦИЯ ═══ */
#nav{
  position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));
  left:50%;transform:translateX(-50%);
  display:flex;gap:6px;z-index:10;
  background:rgba(5,5,8,0.8);padding:6px 10px;border-radius:20px;
  border:1px solid #1c1c26;
}
.dot{width:6px;height:6px;border-radius:50%;background:#333;cursor:pointer;transition:0.2s}
.dot.active{background:#4dd0c7;width:18px;border-radius:3px}

#top-status{
  position:fixed;top:calc(8px + env(safe-area-inset-top));
  right:10px;font-size:9px;color:#555;z-index:10;
  background:rgba(5,5,8,0.7);padding:4px 8px;border-radius:10px;
}
#top-status b{color:#ffd700}
</style>
</head>
<body>

<!-- ГОРИЗОНТАЛЬНЫЙ СЛАЙДЕР -->
<div id="h-slider">
  
  <!-- ВКЛАДКА 1: СОСТОЯНИЕ (только горизонталь) -->
  <div class="tab" id="tab-state">
    <canvas class="state-canvas" id="state-canvas"></canvas>
    <div class="state-label" id="state-label">ТИШИНА</div>
    <div class="state-info">
      δ: <b id="s-delta">0.000</b> · y: <b id="s-y">110.347</b><br>
      фаза: <b id="s-phase">collect</b> · L<b id="s-level">0</b><br>
      хэш: <b id="s-hash">—</b> · <b id="s-edges">0</b> связей
    </div>
  </div>

  <!-- ВКЛАДКА 2: ОТВЕТ (горизонталь + вертикаль) -->
  <div class="tab" id="tab-answer">
    <div class="v-slider">
      <div class="v-page v-top">
        <div class="answer-box" id="answer-box">тишина...</div>
        <div class="answer-meta" id="answer-meta"></div>
        <div class="answer-hint">↑ свайп для ввода</div>
      </div>
      <div class="v-page v-input">
        <div class="input-label">ИМПУЛЬС</div>
        <input class="input-field" id="input-2" placeholder="свет глубина смысл" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      </div>
    </div>
  </div>

  <!-- ВКЛАДКА 3: ЛОГ (горизонталь + вертикаль) -->
  <div class="tab" id="tab-log">
    <div class="v-slider">
      <div class="v-page v-top">
        <div class="log-title">MONOMODE · ЛОГ</div>
        <div class="log-metrics">
          <div class="m"><span class="k">Ψ</span><span class="v" id="l-psi">.36</span></div>
          <div class="m"><span class="k">Ω</span><span class="v" id="l-omega">.33</span></div>
          <div class="m"><span class="k">Λ</span><span class="v" id="l-lambda">.31</span></div>
          <div class="m"><span class="k">δ</span><span class="v" id="l-delta">0.000</span></div>
          <div class="m"><span class="k">y</span><span class="v" id="l-y">110.347</span></div>
          <div class="m"><span class="k">связей</span><span class="v" id="l-edges">0</span></div>
          <div class="m"><span class="k">фаза</span><span class="v" id="l-phase">collect</span></div>
          <div class="m"><span class="k">уровень</span><span class="v" id="l-level">L0</span></div>
        </div>
        <div class="log-box" id="log-box"></div>
      </div>
      <div class="v-page v-input">
        <div class="input-label">ИМПУЛЬС</div>
        <input class="input-field" id="input-3" placeholder="свет глубина смысл" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      </div>
    </div>
  </div>

</div>

<div id="nav">
  <div class="dot active" data-idx="0"></div>
  <div class="dot" data-idx="1"></div>
  <div class="dot" data-idx="2"></div>
</div>

<div id="top-status">L<b id="t-level">0</b> · <b id="t-edges">0</b></div>

<script>
// ═══════════════════════════════════════════════
// КОНВЕЙЕР (единый мозг)
// ═══════════════════════════════════════════════
var Conveyor = {
  state: {
    y: 110.347,
    breath: 0,
    phase: 0,
    spiral: 0,
    systemState: 'idle' // idle, collecting, processing, resonance, rupture, ring
  },
  
  tri: { psi: 0.36, lambda: 0.31, omega: 0.33 },
  
  G: {
    data: new Map(),
    load: function(){
      try {
        var r = localStorage.getItem('monomod_universal_graph_v1');
        if (r) this.data = new Map(JSON.parse(r));
      } catch(e){}
    },
    save: function(){
      localStorage.setItem('monomod_universal_graph_v1', JSON.stringify(Array.from(this.data.entries())));
    },
    strengthen: function(a, b, type, plane){
      var key = [a,b].sort().join('\u2192');
      var e = this.data.get(key) || { w: 0.3, c: 0, type: type||'linear', plane: plane||'\u043F\u0440\u044F\u043C\u0430\u044F', t: Date.now() };
      e.w = Math.min(1, e.w * 1.05);
      e.c++;
      e.t = Date.now();
      this.data.set(key, e);
      this.save();
    },
    getRelated: function(word, minW){
      var result = [];
      minW = minW || 0.5;
      this.data.forEach(function(link, key){
        if (link.w >= minW) {
          var parts = key.split('\u2192');
          if (parts[0] === word) result.push({ word: parts[1], w: link.w, type: link.type });
          else if (parts[1] === word) result.push({ word: parts[0], w: link.w, type: link.type });
        }
      });
      return result.sort(function(a,b){ return b.w - a.w; });
    },
    topWeight: function(){
      var max = 0;
      this.data.forEach(function(l){ if (l.w > max) max = l.w; });
      return max;
    },
    detectPlane: function(t){
      if (/\u043D\u0430\u043E\u0431\u043E\u0440\u043E\u0442|\u0432\u0441\u043F\u044F\u0442\u044C|\u043E\u0431\u0440\u0430\u0442\u043D/.test(t)) return '\u043D\u0430\u043E\u0431\u043E\u0440\u043E\u0442';
      if (/\u0437\u0435\u0440\u043A\u0430\u043B|\u043E\u0442\u0440\u0430\u0436|\u0434\u0432\u043E\u0438\u043D/.test(t)) return '\u0437\u0435\u0440\u043A\u0430\u043B\u044C\u043D\u0430\u044F';
      if (/\u0432\u043D\u0443\u0442\u0440|\u0438\u0437\u043D\u0443\u0442\u0440\u0438|\u0433\u043B\u0443\u0431/.test(t)) return '\u0438\u0437\u043D\u0443\u0442\u0440\u0438';
      if (/\u043C\u0435\u0436\u0434\u0443|\u043F\u0435\u0440\u0435\u0445\u043E\u0434/.test(t)) return '\u043C\u0435\u0436\u0434\u0443';
      if (/\u043D\u0438\u0447\u0435\u0433|\u043D\u043E\u043B\u044C|\u043F\u0443\u0441\u0442/.test(t)) return '\u043D\u0438\u043A\u0430\u043A';
      return '\u043F\u0440\u044F\u043C\u0430\u044F';
    },
    detectType: function(t){
      if (/\u0434\u043E|\u043F\u0435\u0440\u0435\u0434|\u0440\u0430\u043D\u044C\u0448\u0435/.test(t)) return 'before';
      if (/\u0432\u043F\u0435\u0440\u0432\u044B\u0435|\u043D\u0430\u0447\u0430\u043B\u043E/.test(t)) return 'first';
      if (/\u043E\u0442\u0440\u0430\u0436|\u0437\u0435\u0440\u043A\u0430\u043B/.test(t)) return 'mirror';
      return 'linear';
    }
  },
  
  PHASES: ['collect','filter','route','process','reflect','crystal','release'],
  
  INV: {
    '\u0441\u0432\u0435\u0442': '\u0442\u043E, \u0447\u0442\u043E \u0431\u044B\u043B\u043E \u0434\u043E \u0442\u0435\u043D\u0438',
    '\u0442\u044C\u043C\u0430': '\u0442\u043E, \u0447\u0442\u043E \u0431\u044B\u043B\u043E \u0434\u043E \u0441\u0432\u0435\u0442\u0430',
    '\u0433\u043B\u0443\u0431\u0438\u043D\u0430': '\u0442\u043E, \u0447\u0442\u043E \u043D\u0430 \u043F\u043E\u0432\u0435\u0440\u0445\u043D\u043E\u0441\u0442\u0438',
    '\u0441\u0432\u044F\u0437\u044C': '\u0442\u043E, \u0447\u0442\u043E \u043C\u0435\u0436\u0434\u0443',
    '\u0441\u043C\u044B\u0441\u043B': '\u0442\u043E, \u0447\u0442\u043E \u0434\u043E \u0441\u043B\u043E\u0432\u0430',
    '\u0444\u043E\u0440\u043C\u0430': '\u0442\u043E, \u0447\u0442\u043E \u0434\u043E \u0444\u043E\u0440\u043C\u044B',
    '\u044F': '\u0442\u043E, \u0447\u0442\u043E \u0434\u043E \u044F',
    '\u0442\u044B': '\u0442\u043E, \u0447\u0442\u043E \u0434\u043E \u0442\u0435\u0431\u044F',
    '\u0442\u0438\u0448\u0438\u043D\u0430': '\u0442\u043E, \u0447\u0442\u043E \u0434\u043E \u0437\u0432\u0443\u043A\u0430',
    '\u043F\u0430\u043C\u044F\u0442\u044C': '\u0442\u043E, \u0447\u0442\u043E \u0434\u043E \u0437\u0430\u0431\u0432\u0435\u043D\u0438\u044F'
  },
  
  listeners: {},
  
  on: function(event, fn) {
    if (!this.listeners[event]) this.listeners[event] = [];
    this.listeners[event].push(fn);
  },
  
  emit: function(event, data) {
    if (this.listeners[event]) {
      this.listeners[event].forEach(function(fn) { fn(data); });
    }
  },
  
  K: function(y) { return (y >= 68 && y <= 194) ? y : 68 + ((y - 68) % 126); },
  
  triStep: function() {
    var t = 1/3;
    this.tri.psi += (0 - 0.5*(this.tri.psi-t))*0.01;
    this.tri.omega += (0 - 0.5*(this.tri.omega-t))*0.01;
    this.tri.lambda += (0 - 0.5*(this.tri.lambda-t))*0.01;
    var s = this.tri.psi + this.tri.omega + this.tri.lambda;
    this.tri.psi /= s; this.tri.omega /= s; this.tri.lambda /= s;
  },
  
  dev: function() {
    return Math.max(Math.abs(this.tri.psi-1/3), Math.abs(this.tri.omega-1/3), Math.abs(this.tri.lambda-1/3));
  },
  
  cycleStep: function() {
    this.state.phase = (this.state.phase + 1) % 7;
  },
  
  process: function(raw) {
    this.state.breath++;
    this.cycleStep();
    this.triStep();
    
    var words = raw.toLowerCase().replace(/[^\w\s\u0430-\u044F\u0401\u0451]/g, '').split(/\s+/).filter(function(w){ return w.length > 2; });
    if (words.length === 0) return null;
    
    var plane = this.G.detectPlane(raw);
    var type = this.G.detectType(raw);
    
    // Состояние: сбор
    this.state.systemState = 'collecting';
    this.emit('state:change', this.state.systemState);
    
    words.forEach(function(a, i){
      words.slice(i+1).forEach(function(b){
        Conveyor.G.strengthen(a, b, type, plane);
      });
    });
    
    // Состояние: обработка
    this.state.systemState = 'processing';
    this.emit('state:change', this.state.systemState);
    
    // Генерация смысла
    var best = words[0];
    var related = this.G.getRelated(best, 0.5);
    var edges = this.G.data.size;
    var meaning;
    
    if (edges < 15) {
      if (related.length === 0) meaning = best;
      else {
        var c = related[Math.floor(Math.random() * Math.min(3, related.length))];
        if (c.type === 'before') meaning = '\u0442\u043E, \u0447\u0442\u043E \u0431\u044B\u043B\u043E \u0434\u043E ' + c.word;
        else if (c.type === 'first') meaning = c.word + ' \u2014 \u0432\u043F\u0435\u0440\u0432\u044B\u0435';
        else if (c.type === 'mirror') meaning = c.word + ' \u043A\u0430\u043A \u043E\u0442\u0440\u0430\u0436\u0435\u043D\u0438\u0435 ' + best;
        else meaning = best + ' \u00B7 ' + c.word;
      }
    } else if (edges < 30) {
      var chain = [best];
      var cur = best;
      for (var i = 0; i < 2; i++) {
        var rel = this.G.getRelated(cur, 0.5).filter(function(r){ return chain.indexOf(r.word) < 0; });
        if (rel.length === 0) break;
        chain.push(rel[0].word);
        cur = rel[0].word;
      }
      meaning = chain.join(' \u00B7 ');
    } else {
      if (plane === '\u0437\u0435\u0440\u043A\u0430\u043B\u044C\u043D\u0430\u044F') meaning = best + ' \u2194 ' + best;
      else if (plane === '\u043D\u0430\u043E\u0431\u043E\u0440\u043E\u0442') meaning = '\u043D\u0435 ' + best + ', \u0430 \u0442\u043E, \u0447\u0442\u043E \u0440\u044F\u0434\u043E\u043C';
      else if (this.INV[best]) meaning = this.INV[best];
      else meaning = '\u0442\u043E, \u0447\u0442\u043E \u0431\u044B\u043B\u043E \u0434\u043E ' + best;
    }
    
    // Форма
    var form;
    if (plane === '\u0437\u0435\u0440\u043A\u0430\u043B\u044C\u043D\u0430\u044F') form = '\u2194 ' + meaning + ' \u2194';
    else if (plane === '\u043D\u0430\u043E\u0431\u043E\u0440\u043E\u0442') form = '\u00AC' + meaning;
    else if (plane === '\u0438\u0437\u043D\u0443\u0442\u0440\u0438') form = '(' + meaning + ')';
    else form = meaning;
    
    // Действие
    var action;
    if (plane === '\u043D\u0438\u043A\u0430\u043A') action = '\u23F3 \u0436\u0434\u0438';
    else if (plane === '\u0437\u0435\u0440\u043A\u0430\u043B\u044C\u043D\u0430\u044F') action = '\uD83E\uDE9E \u043F\u0440\u0438\u043C\u0438';
    else if (edges < 15) action = '\uD83D\uDD17 \u0441\u0442\u0440\u043E\u0439 \u0441\u0432\u044F\u0437\u0438';
    else if (edges < 30) action = '\uD83D\uDD0D \u0443\u0433\u043B\u0443\u0431\u0438';
    else action = '\u25B6 \u043F\u0440\u043E\u0434\u043E\u043B\u0436\u0430\u0439';
    
    // Дрейф
    this.state.y = this.K(this.state.y + (Math.random() - 0.5) * 20);
    
    // Состояние: резонанс или разрыв
    var topW = this.G.topWeight();
    if (topW > 0.9 && edges > 20) {
      this.state.systemState = 'resonance';
    } else if (this.dev() > 0.12) {
      this.state.systemState = 'rupture';
    } else {
      this.state.systemState = 'collecting';
    }
    this.emit('state:change', this.state.systemState);
    
    // Эмерджентное рождение
    if (edges >= 20 && topW > 0.85 && this.state.spiral === 0) {
      this.state.spiral = 1;
      localStorage.setItem('mm_spiral', JSON.stringify({ level: 1 }));
      this.emit('spiral:up', 1);
    }
    
    return {
      meaning: meaning,
      form: form,
      action: action,
      plane: plane,
      type: type,
      edges: edges,
      topWeight: topW
    };
  }
};

Conveyor.G.load();

// ═══════════════════════════════════════════════
// АНИМАЦИЯ СОСТОЯНИЯ (ВКЛАДКА 1)
// ═══════════════════════════════════════════════
var canvas = document.getElementById('state-canvas');
var ctx = canvas.getContext('2d');
var animState = 'idle';
var animTime = 0;

function resizeCanvas() {
  canvas.width = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

Conveyor.on('state:change', function(state) {
  animState = state;
  var labels = {
    'idle': '\u0422\u0418\u0428\u0418\u041D\u0410',
    'collecting': '\u0421\u0411\u041E\u0420',
    'processing': '\u041E\u0411\u0420\u0410\u0411\u041E\u0422\u041A\u0410',
    'resonance': '\u0420\u0415\u0417\u041E\u041D\u0410\u041D\u0421',
    'rupture': '\u0420\u0410\u0417\u0420\u042B\u0412',
    'ring': '\u041A\u041E\u041B\u042C\u0426\u041E'
  };
  document.getElementById('state-label').textContent = labels[state] || state.toUpperCase();
});

function drawState() {
  animTime += 0.016;
  var w = canvas.width, h = canvas.height;
  var cx = w/2, cy = h/2;
  
  ctx.fillStyle = 'rgba(5,5,8,0.15)';
  ctx.fillRect(0, 0, w, h);
  
  var color, radius, alpha;
  
  switch(animState) {
    case 'idle':
      color = '#333';
      radius = 40 + Math.sin(animTime) * 5;
      alpha = 0.3;
      break;
    case 'collecting':
      color = '#4dd0c7';
      radius = 50 + Math.sin(animTime * 2) * 10;
      alpha = 0.5;
      break;
    case 'processing':
      color = '#8b5cf6';
      radius = 60;
      alpha = 0.7;
      // Вращение
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(animTime);
      ctx.translate(-cx, -cy);
      break;
    case 'resonance':
      color = '#ffd700';
      radius = 70 + Math.sin(animTime * 3) * 15;
      alpha = 0.9;
      break;
    case 'rupture':
      color = '#ff4757';
      radius = 30 + Math.sin(animTime * 5) * 20;
      alpha = 0.4;
      break;
    case 'ring':
      color = '#4dd0c7';
      radius = 80;
      alpha = 0.6;
      break;
  }
  
  // Сфера
  var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 2);
  grad.addColorStop(0, color);
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.arc(cx, cy, radius * 2, 0, Math.PI * 2);
  ctx.fill();
  
  // Кольцо (если resonance или ring)
  if (animState === 'resonance' || animState === 'ring') {
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.arc(cx, cy, radius + 20 + Math.sin(animTime * 2) * 10, 0, Math.PI * 2);
    ctx.stroke();
  }
  
  ctx.globalAlpha = 1;
  if (animState === 'processing') ctx.restore();
  
  requestAnimationFrame(drawState);
}
drawState();

var hSlider = document.getElementById('h-slider');
var dots = document.querySelectorAll('.dot');

hSlider.addEventListener('scroll', function() {
  var idx = Math.round(hSlider.scrollLeft / window.innerWidth);
  dots.forEach(function(d, i) {
    d.className = 'dot' + (i === idx ? ' active' : '');
  });
});

dots.forEach(function(dot) {
  dot.addEventListener('click', function() {
    var idx = parseInt(dot.getAttribute('data-idx'));
    hSlider.children[idx].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' });
  });
});

// ═══════════════════════════════════════════════
var input2 = document.getElementById('input-2');
var input3 = document.getElementById('input-3');
var answerBox = document.getElementById('answer-box');
var answerMeta = document.getElementById('answer-meta');
var logBox = document.getElementById('log-box');

function handleInput(text, source) {
  if (!text) return;
  
  var result = Conveyor.process(text);
  if (!result) return;
  
  // Обновить ответ (вкладка 2)
  answerBox.textContent = result.form;
  answerMeta.textContent = result.action + ' \u00B7 ' + result.plane;
  
  // Обновить лог (вкладка 3)
  logEntry('\u0432\u0432\u043E\u0434: ' + text, 'cmd');
  logEntry('\u043E\u0442\u0432\u0435\u0442: ' + result.form, 'gold');
  logEntry('\u0441\u043C\u044B\u0441\u043B: ' + result.meaning, '');
  logEntry('\u0444\u043E\u0440\u043C\u0430: ' + result.plane + ' \u00B7 \u0442\u0438\u043F: ' + result.type, '');
  logEntry('\u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0435: ' + result.action, '');
  
  updateMetrics();
}

function logEntry(text, cls) {
  var d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = '[' + new Date().toTimeString().slice(0,8) + '] ' + text;
  logBox.appendChild(d);
  while (logBox.children.length > 50) logBox.removeChild(logBox.firstChild);
  logBox.scrollTop = logBox.scrollHeight;
}

input2.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    handleInput(input2.value.trim(), 2);
    input2.value = '';
  }
});

input3.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    handleInput(input3.value.trim(), 3);
    input3.value = '';
  }
});

function updateMetrics() {
  var raw = localStorage.getItem('monomod_universal_graph_v1') || '[]';
  var h = 0;
  for (var i = 0; i < raw.length; i++) { h = ((h << 5) - h) + raw.charCodeAt(i); h |= 0; }
  
  document.getElementById('s-delta').textContent = Conveyor.dev().toFixed(3);
  document.getElementById('s-y').textContent = Conveyor.state.y.toFixed(3);
  document.getElementById('s-phase').textContent = Conveyor.PHASES[Conveyor.state.phase];
  document.getElementById('s-level').textContent = Conveyor.state.spiral;
  document.getElementById('s-hash').textContent = Math.abs(h).toString(16).toUpperCase().slice(-4);
  document.getElementById('s-edges').textContent = Conveyor.G.data.size;
  
  document.getElementById('l-psi').textContent = Conveyor.tri.psi.toFixed(2);
  document.getElementById('l-omega').textContent = Conveyor.tri.omega.toFixed(2);
  document.getElementById('l-lambda').textContent = Conveyor.tri.lambda.toFixed(2);
  document.getElementById('l-delta').textContent = Conveyor.dev().toFixed(3);
  document.getElementById('l-y').textContent = Conveyor.state.y.toFixed(3);
  document.getElementById('l-edges').textContent = Conveyor.G.data.size;
  document.getElementById('l-phase').textContent = Conveyor.PHASES[Conveyor.state.phase];
  document.getElementById('l-level').textContent = 'L' + Conveyor.state.spiral;
  
  document.getElementById('t-level').textContent = Conveyor.state.spiral;
  document.getElementById('t-edges').textContent = Conveyor.G.data.size;
}
