<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050508">
<title>MONOMOD</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#050508;color:#c8c8d4;font-family:'Courier New',monospace;overflow:hidden;-webkit-tap-highlight-color:transparent}
#slider{display:flex;height:calc(100vh - 60px);overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#slider::-webkit-scrollbar{display:none}
.page{flex:0 0 100vw;height:100%;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid #1c1c26;padding:20px;position:relative}
.page-label{position:absolute;top:20px;left:20px;font-size:10px;color:#555;letter-spacing:2px}
.page-label b{color:#4dd0c7}
.page-title{font-size:22px;letter-spacing:3px;margin-bottom:16px;color:#ffd700;text-align:center}
.page-desc{font-size:11px;color:#555;margin-bottom:24px;max-width:320px;text-align:center;line-height:1.5}
.launch-btn{padding:14px 36px;background:transparent;border:1px solid #4dd0c7;color:#4dd0c7;font:inherit;font-size:11px;cursor:pointer;letter-spacing:2px}
.launch-btn:active{background:rgba(77,208,199,0.15)}
#nav{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10}
.dot{width:6px;height:6px;border-radius:50%;background:#333;cursor:pointer}
.dot.active{background:#4dd0c7;width:20px;border-radius:3px}
#terminal{position:fixed;top:10px;right:10px;width:200px;max-height:30vh;background:#0a0a12;border:1px solid #1c1c26;padding:8px;font-size:9px;overflow-y:auto;z-index:10;opacity:0.7}
#terminal .line{margin-bottom:2px;color:#555;word-break:break-all}
#terminal .line.gold{color:#ffd700}
#terminal .line.cmd{color:#4dd0c7}
#status{position:fixed;bottom:8px;right:10px;font-size:9px;color:#555;z-index:10}
#status b{color:#ffd700}
</style>
</head>
<body>

<div id="slider"></div>
<div id="nav"></div>
<div id="terminal"></div>
<div id="status">хэш: <b id="hash">—</b> · L<b id="level">0</b> · <b id="edges">0</b></div>

<script>
// ═══════════════════════════════════════════════
// УТИЛИТЫ
// ═══════════════════════════════════════════════
function log(text, cls) {
  var t = document.getElementById('terminal');
  var d = document.createElement('div');
  d.className = 'line' + (cls ? ' ' + cls : '');
  d.textContent = text;
  t.appendChild(d);
  while (t.children.length > 40) t.removeChild(t.firstChild);
  t.scrollTop = t.scrollHeight;
}

function getRegistry() {
  try { return JSON.parse(localStorage.getItem('monomod_registry') || '[]'); }
  catch(e) { return []; }
}

function saveRegistry(r) {
  localStorage.setItem('monomod_registry', JSON.stringify(r));
}

function getGraph() {
  try { return JSON.parse(localStorage.getItem('monomod_universal_graph_v1') || '[]'); }
  catch(e) { return []; }
}

function hash(str) {
  var h = 0;
  for (var i = 0; i < str.length; i++) {
    h = ((h << 5) - h) + str.charCodeAt(i);
    h |= 0;
  }
  return Math.abs(h).toString(16).toUpperCase().slice(-4);
}

// ═══════════════════════════════════════════════
// МЕЖДУВКЛАДОЧНАЯ СВЯЗЬ (с fallback для iOS)
// ═══════════════════════════════════════════════
var Bus = {
  listeners: {},
  
  on: function(event, fn) {
    if (!this.listeners[event]) this.listeners[event] = [];
    this.listeners[event].push(fn);
  },
  
  emit: function(event, data) {
    // Локальные слушатели
    if (this.listeners[event]) {
      this.listeners[event].forEach(function(fn) { fn(data); });
    }
    // Через localStorage (работает везде, включая iOS)
    try {
      localStorage.setItem('monomod_bus_' + event, JSON.stringify({ t: Date.now(), data: data }));
    } catch(e) {}
    // BroadcastChannel (если поддерживается)
    if (window._bc) {
      try { window._bc.postMessage({ type: event, data: data }); } catch(e) {}
    }
  }
};

// Инициализация каналов
try {
  if (typeof BroadcastChannel !== 'undefined') {
    window._bc = new BroadcastChannel('monomod_shell');
    window._bc.onmessage = function(e) {
      if (e.data && e.data.type) Bus.emit(e.data.type, e.data.data);
    };
  }
} catch(e) {
  log('BroadcastChannel недоступен, используем localStorage', 'cmd');
}

// Слушаем изменения localStorage (fallback)
window.addEventListener('storage', function(e) {
  if (e.key && e.key.indexOf('monomod_bus_') === 0) {
    try {
      var event = e.key.replace('monomod_bus_', '');
      var msg = JSON.parse(e.newValue);
      if (msg && msg.data) Bus.emit(event, msg.data);
    } catch(err) {}
  }
});

// СЛАЙДЕР
// ══════════════════════════════════════════════
function renderSlider() {
  var slider = document.getElementById('slider');
  var nav = document.getElementById('nav');
  slider.innerHTML = '';
  nav.innerHTML = '';
  
  var apps = [
    { id: 'MONOMODE', name: 'MONOMODE', desc: 'Мозг · граф · триада · генераторы смысла/формы/действия', string: MONOMODE_HTML, type: 'core' },
    { id: 'MONOMOD', name: 'MONOMOD', desc: 'Чат · ввод · вывод · тонкая оболочка', string: MONOMOD_HTML, type: 'core' }
  ];
  
  var registry = getRegistry();
  for (var i = 0; i < registry.length; i++) apps.push(registry[i]);
  
  for (var i = 0; i < apps.length; i++) {
    (function(app, idx) {
      var page = document.createElement('div');
      page.className = 'page';
      
      var label = document.createElement('div');
      label.className = 'page-label';
      label.innerHTML = '<b>' + app.id + '</b> · ' + (app.type || 'app');
      page.appendChild(label);
      
      var title = document.createElement('div');
      title.className = 'page-title';
      title.textContent = app.name;
      page.appendChild(title);
      
      var desc = document.createElement('div');
      desc.className = 'page-desc';
      desc.textContent = app.desc;
      page.appendChild(desc);
      
      var btn = document.createElement('button');
      btn.className = 'launch-btn';
      btn.textContent = 'ЗАПУСТИТЬ';
      btn.onclick = function() { launchApp(app); };
      page.appendChild(btn);
      
      slider.appendChild(page);
      
      var dot = document.createElement('div');
      dot.className = 'dot' + (idx === 0 ? ' active' : '');
      dot.onclick = function() {
        slider.children[idx].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' });
      };
      nav.appendChild(dot);
    })(apps[i], i);
  }
  
  slider.onscroll = function() {
    var idx = Math.round(slider.scrollLeft / window.innerWidth);
    var dots = nav.querySelectorAll('.dot');
    for (var i = 0; i < dots.length; i++) {
      dots[i].className = 'dot' + (i === idx ? ' active' : '');
    }
  };
}

function launchApp(app) {
  try {
    var blob = new Blob([app.string], { type: 'text/html' });
    var url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    log('запуск: ' + app.id, 'cmd');
  } catch(e) {
    log('ошибка запуска: ' + e.message, 'gold');
  }
}

// ═══════════════════════════════════════════════
// СЛУШАТЕЛЬ ОБОЛОЧКИ
// ═══════════════════════════════════════════════
Bus.on('register_app', function(app) {
  var registry = getRegistry();
  var found = false;
  for (var i = 0; i < registry.length; i++) {
    if (registry[i].id === app.id) {
      registry[i] = Object.assign({}, registry[i], app, { updated: Date.now() });
      found = true;
      break;
    }
  }
  if (!found) registry.push(Object.assign({}, app, { created: Date.now() }));
  saveRegistry(registry);
  renderSlider();
  log('приложение: ' + app.id, 'gold');
});

function updateStatus() {
  var raw = localStorage.getItem('monomod_universal_graph_v1') || '[]';
  var data = [];
  try { data = JSON.parse(raw); } catch(e) {}
  var spiral = {};
  try { spiral = JSON.parse(localStorage.getItem('mm_spiral') || '{}'); } catch(e) {}
  
  document.getElementById('hash').textContent = hash(raw);
  document.getElementById('level').textContent = spiral.level || 0;
  document.getElementById('edges').textContent = data.length;
}
